<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="transparent">
  <title>تنبيه التبرعات | SLOW429</title>
  <style>
    :root {
      color-scheme: dark;
      --text: #fff;
      --muted: #d4c7e9;
      --purple: #be83ff;
      --green: #bdff72;
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; min-height: 100%; margin: 0; }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 20px;
      background: transparent;
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    }

    .alert {
      display: flex;
      width: min(100%, 690px);
      align-items: center;
      gap: 20px;
      padding: 18px 22px;
      border: 1px solid rgb(205 164 255 / 72%);
      border-radius: 23px;
      background:
        radial-gradient(ellipse at 0% 50%, rgb(136 65 205 / 38%), transparent 45%),
        linear-gradient(125deg, rgb(15 10 24 / 96%), rgb(28 16 43 / 95%));
      box-shadow: 0 0 35px rgb(167 98 255 / 42%), inset 0 1px rgb(255 255 255 / 13%);
      opacity: 0;
      transform: translateY(22px) scale(.96);
      visibility: hidden;
    }

    .alert.visible { visibility: visible; animation: enter .5s cubic-bezier(.2,.8,.2,1) forwards; }
    .alert.leaving { animation: leave .4s ease forwards; }

    .avatar {
      width: 82px;
      height: 82px;
      flex: 0 0 auto;
      overflow: hidden;
      border: 2px solid var(--purple);
      border-radius: 50%;
      box-shadow: 0 0 22px rgb(169 112 255 / 48%);
    }

    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .copy { min-width: 0; flex: 1; }
    .eyebrow { margin: 0 0 4px; color: var(--green); font-size: .83rem; font-weight: 800; letter-spacing: .06em; }
    .name { overflow: hidden; margin: 0; font-size: clamp(1.3rem, 4vw, 2rem); font-weight: 900; text-overflow: ellipsis; white-space: nowrap; }
    .message { overflow-wrap: anywhere; margin: 3px 0 0; color: var(--muted); font-size: .95rem; }
    .amount { flex: 0 0 auto; color: var(--green); direction: ltr; font-size: clamp(1.5rem, 4.2vw, 2.2rem); font-weight: 900; text-shadow: 0 0 20px rgb(189 255 114 / 35%); }

    .connection {
      position: fixed;
      inset: auto 12px 10px;
      color: rgb(255 255 255 / 55%);
      font-size: 11px;
      text-align: center;
    }

    .connection[hidden] { display: none; }

    .video-overlay {
      position: fixed;
      z-index: 2;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 4vw;
      background: rgb(0 0 0 / 94%);
      opacity: 0;
      visibility: hidden;
      transition: opacity .25s ease, visibility .25s ease;
    }

    .video-overlay.visible { opacity: 1; visibility: visible; }

    .video-overlay.compact {
      inset: auto 3vw 4vh auto;
      display: block;
      width: min(32vw, 480px);
      padding: 0;
      background: transparent;
      opacity: 0;
      transform: translateY(12px) scale(.97);
      transition: opacity .25s ease, transform .25s ease, visibility .25s ease;
    }

    .video-overlay.compact.visible { opacity: 1; transform: translateY(0) scale(1); }

    .video-frame {
      width: min(100%, 1280px);
      overflow: hidden;
      aspect-ratio: 16 / 9;
      border: 1px solid rgb(190 131 255 / 80%);
      border-radius: 20px;
      background: #000;
      box-shadow: 0 0 60px rgb(167 98 255 / 42%);
    }

    .video-frame video { display: block; width: 100%; height: 100%; object-fit: contain; }

    @media (max-width: 700px) {
      .video-overlay.compact { right: 12px; bottom: 12px; width: min(44vw, 300px); }
    }

    @keyframes enter {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes leave {
      to { opacity: 0; transform: translateY(-12px) scale(.98); visibility: hidden; }
    }

    @media (max-width: 500px) {
      body { padding: 12px; }
      .alert { gap: 12px; padding: 13px; border-radius: 18px; }
      .avatar { width: 60px; height: 60px; }
      .eyebrow { font-size: .72rem; }
      .message { font-size: .8rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .alert.visible, .alert.leaving { animation-duration: .01ms; }
    }
  </style>
</head>
<body>
  <div class="video-overlay" id="video-overlay" aria-hidden="true">
    <div class="video-frame">
      <video id="donation-video" playsinline preload="auto"></video>
      <audio id="donation-audio" preload="auto"></audio>
    </div>
  </div>
  <main class="alert" id="donation-alert" role="status" aria-live="polite">
    <div class="avatar"><img src="slow429-profile.webp" alt=""></div>
    <div class="copy">
      <p class="eyebrow" id="alert-eyebrow">دعم جديد وصل للقناة!</p>
      <p class="name" id="donor-name">متبرع مجهول</p>
      <p class="message" id="alert-message">شكرًا من القلب على دعمك 💜</p>
    </div>
    <div class="amount" id="donation-amount">$5.00</div>
  </main>
  <p class="connection" id="connection-status" hidden>بانتظار اتصال تنبيهات التبرع…</p>
  <script>
    (() => {
      const dictionary = {
        ar: {
          eyebrow: "دعم جديد وصل للقناة!",
          anonymous: "متبرع مجهول",
          message: "شكرًا من القلب على دعمك 💜",
          connection: "بانتظار اتصال تنبيهات التبرع…",
        },
        tr: {
          eyebrow: "Kanala yeni bir destek geldi!",
          anonymous: "Anonim destekçi",
          message: "Desteğin için çok teşekkürler 💜",
          connection: "Bağış bildirimlerine bağlanılıyor…",
        },
        en: {
          eyebrow: "New support for the channel!",
          anonymous: "Anonymous supporter",
          message: "Thank you so much for your support 💜",
          connection: "Connecting to donation alerts…",
        },
      };
      const query = new URLSearchParams(window.location.search);
      const queryLocale = query.get("lang");
      const previewMode = query.get("preview");
      let locale = ["ar", "tr", "en"].includes(queryLocale) ? queryLocale : "ar";
      try {
        const savedLocale = window.localStorage.getItem("slow-locale");
        if (!queryLocale && ["ar", "tr", "en"].includes(savedLocale)) locale = savedLocale;
      } catch (error) {
        console.warn("Could not read the saved language preference.", error);
      }

      const text = dictionary[locale];
      const alertElement = document.getElementById("donation-alert");
      const connection = document.getElementById("connection-status");
      const videoOverlay = document.getElementById("video-overlay");
      const donationVideo = document.getElementById("donation-video");
      const donationAudio = document.getElementById("donation-audio");
      const seenStorageKey = "slow-donation-alert-seen-v1";
      const seen = new Set(readSeenDonationIds());
      let canPersistSeenIds = true;
      const queue = [];
      let initialized = false;
      let isShowing = false;
      let errorLogged = false;

      document.documentElement.lang = locale === "tr" ? "tr" : locale;
      document.documentElement.dir = locale === "ar" ? "rtl" : "ltr";

      function readSeenDonationIds() {
        try {
          const stored = window.localStorage.getItem(seenStorageKey);
          if (!stored) return [];
          const ids = JSON.parse(stored);
          return Array.isArray(ids) ? ids.filter((id) => typeof id === "string") : [];
        } catch (error) {
          console.warn("Could not restore processed donation alerts.", error);
          return [];
        }
      }

      function persistSeenDonationIds() {
        if (!canPersistSeenIds) return;
        try {
          window.localStorage.setItem(seenStorageKey, JSON.stringify([...seen].slice(-100)));
        } catch (error) {
          canPersistSeenIds = false;
          console.warn("Could not persist processed donation alerts.", error);
        }
      }

      function showDonationAlert(donation) {
        document.getElementById("alert-eyebrow").textContent = text.eyebrow;
        document.getElementById("donor-name").textContent = donation.name || text.anonymous;
        document.getElementById("alert-message").textContent = donation.message || text.message;

        const formattedAmount = new Intl.NumberFormat("en-US", {
          style: "currency",
          currency: donation.currency,
          numberingSystem: "latn",
        }).format(Number(donation.amount));
        document.getElementById("donation-amount").textContent = formattedAmount;

        alertElement.classList.remove("leaving");
        alertElement.classList.add("visible");
        return new Promise((resolve) => {
          window.setTimeout(() => {
            alertElement.classList.add("leaving");
            window.setTimeout(() => {
              alertElement.classList.remove("visible", "leaving");
              resolve();
            }, 450);
          }, 7000);
        });
      }

      function playDonationVideo(src, audioSrc, mode) {
        videoOverlay.classList.toggle("compact", mode === "side");
        videoOverlay.classList.add("visible");
        videoOverlay.setAttribute("aria-hidden", "false");
        donationVideo.src = src;
        donationVideo.muted = false;
        donationAudio.src = audioSrc;
        donationAudio.muted = false;

        return new Promise((resolve) => {
          let completed = false;
          let retryTimer;
          let playAttempts = 0;
          let audioStarted = false;
          const watchdog = window.setTimeout(() => finish(), 10 * 60 * 1000);

          function finish() {
            if (completed) return;
            completed = true;
            window.clearTimeout(retryTimer);
            window.clearTimeout(watchdog);
            document.removeEventListener("visibilitychange", resumePlayback);
            donationVideo.pause();
            donationAudio.pause();
            donationVideo.removeAttribute("src");
            donationAudio.removeAttribute("src");
            donationVideo.onloadeddata = null;
            donationAudio.oncanplay = null;
            donationVideo.load();
            donationAudio.load();
            videoOverlay.classList.remove("visible", "compact");
            videoOverlay.setAttribute("aria-hidden", "true");
            resolve();
          }

          async function startAudio() {
            if (completed || audioStarted || document.hidden) return;
            if (donationAudio.readyState < HTMLMediaElement.HAVE_FUTURE_DATA) {
              donationAudio.oncanplay = startAudio;
              return;
            }

            audioStarted = true;
            try {
              await donationAudio.play();
            } catch (error) {
              audioStarted = false;
              if (error instanceof Error && error.name === "AbortError") return;
              console.error("Donation alert soundtrack could not be played. Check the OBS browser-source audio settings.", error);
            }
          }

          async function startPlayback() {
            if (completed || document.hidden) return;
            playAttempts += 1;

            try {
              await donationVideo.play();
              startAudio();
            } catch (error) {
              if (error instanceof Error && error.name === "NotAllowedError" && !donationVideo.muted) {
                donationVideo.muted = true;
                retryTimer = window.setTimeout(startPlayback, 0);
                return;
              }

              if (error instanceof Error && error.name === "AbortError" && playAttempts < 20) {
                retryTimer = window.setTimeout(startPlayback, 500);
                return;
              }

              console.error("Donation video playback failed.", error);
              finish();
            }
          }

          function resumePlayback() {
            if (!document.hidden) startPlayback();
          }

          donationVideo.onended = finish;
          donationVideo.onerror = () => {
            console.error(`Donation video failed to load: ${src}`);
            finish();
          };
          donationAudio.onerror = () => {
            console.error(`Donation alert soundtrack failed to load: ${audioSrc}`);
          };
          donationVideo.onloadeddata = startPlayback;
          document.addEventListener("visibilitychange", resumePlayback);
          donationVideo.load();
          donationAudio.load();
        });
      }

      async function displayNext() {
        if (isShowing || queue.length === 0) return;
        const donation = queue.shift();
        isShowing = true;

        const amount = Number(donation.amount);
        if (donation.currency === "USD" && amount >= 100) {
          await playDonationVideo("/donation-video-large.mp4", "/donation-audio-large.mp3", "fullscreen");
          await showDonationAlert(donation);
        } else if (donation.currency === "USD" && amount >= 1 && amount < 100) {
          await Promise.all([
            playDonationVideo("/donation-video-small.mp4", "/donation-audio-small.mp3", "side"),
            showDonationAlert(donation),
          ]);
        } else {
          await showDonationAlert(donation);
        }

        isShowing = false;
        displayNext();
      }

      async function pollDonations() {
        if (document.hidden) return;

        try {
          const response = await fetch("/api/donations", { cache: "no-store" });
          if (!response.ok) throw new Error(`Donation alert service returned ${response.status}.`);
          const data = await response.json();
          if (!Array.isArray(data.donations)) throw new Error("Donation alert response was invalid.");
          connection.hidden = true;
          errorLogged = false;

          if (!initialized) {
            const unseen = data.donations
              .filter((donation) => typeof donation.id === "string" && !seen.has(donation.id))
              .reverse();

            if (seen.size === 0 && unseen.length > 0) {
              queue.push(unseen[unseen.length - 1]);
            } else {
              queue.push(...unseen);
            }

            data.donations.forEach((donation) => {
              if (typeof donation.id === "string") seen.add(donation.id);
            });
            persistSeenDonationIds();
            initialized = true;
            displayNext();
            return;
          }

          data.donations.slice().reverse().forEach((donation) => {
            if (typeof donation.id !== "string" || seen.has(donation.id)) return;
            seen.add(donation.id);
            queue.push(donation);
          });
          persistSeenDonationIds();
          displayNext();
        } catch (error) {
          if (!initialized) connection.hidden = false;
          connection.textContent = text.connection;
          if (!errorLogged) {
            console.error("Could not check for donation alerts.", error);
            errorLogged = true;
          }
        }
      }

      if (previewMode === "small" || previewMode === "large") {
        initialized = true;
        queue.push({
          id: `preview-${previewMode}`,
          name: "اختبار التنبيه",
          message: "معاينة الفيديو والرسالة",
          amount: previewMode === "large" ? "100.00" : "10.00",
          currency: "USD",
          createdAt: new Date().toISOString(),
        });
        displayNext();
      } else {
        pollDonations();
        window.setInterval(pollDonations, 4000);
        document.addEventListener("visibilitychange", pollDonations);
      }
    })();
  </script>
</body>
</html>
